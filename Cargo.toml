[workspace]
members = ["programs/*"]
resolver = "2"

# Cargo.lock pins transitive crates so Solana platform-tools v1.51 (rustc 1.84)
# can parse them. `cargo update` without checking those pins will break `anchor build`.

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
